name: DodoNews - Nouvelles du matin

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: |
          python -m pip install -q -r requirements.txt
      
      - name: Générer les nouvelles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agregador.py
      
      - name: Commit et Push
        run: |
          git config user.name "DodoNews Bot"
          git config user.email "dodonews@local"
          if [ -n "$(git status --porcelain)" ]; then
            git add output/
            git commit -m "🌅 DodoNews $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
      
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'output'
      
      - uses: actions/deploy-pages@v2
        if: always()
