name: DodoNews - Nouvelles du matin

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install -q -r requirements.txt

      - name: Générer les nouvelles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Le site publié est le dossier 'output' (voir upload-pages-artifact
          # plus bas), donc le script doit écrire son index.html là-dedans.
          DODONEWS_OUTPUT: output/index.html
        run: |
          mkdir -p output
          python agregador.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'output'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
